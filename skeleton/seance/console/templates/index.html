<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<header class="header">
  <h1 class="wordmark">Seance</h1>
  <p class="app-name" id="app-name">Read-only console</p>
  <p class="chip">READ-ONLY, 5 TOOLS</p>
  <p class="last-read">Last read <span class="mono" id="last-read">none yet</span></p>
  <button type="button" id="read-again" class="button">Read again</button>
</header>
<section class="summary" id="summary" aria-label="Summary" aria-live="polite"></section>
<div class="layout">
  <main class="main">
    <div id="devices"></div>
    <section class="tool-panel" id="tool-panel">
      <h2 class="section-title">Call a tool yourself</h2>
      <form id="tool-form" class="tool-form">
        <div class="field">
          <label for="tool-select">Tool</label>
          <select id="tool-select" name="tool"></select>
        </div>
        <div class="field">
          <label for="device-select">Device</label>
          <select id="device-select" name="device"></select>
        </div>
        <div class="field">
          <label for="point-select">Point</label>
          <select id="point-select" name="point"></select>
        </div>
        <button type="submit" id="tool-send" class="button">Send</button>
      </form>
      <h3 class="sub-title">Raw reply</h3>
      <pre class="reply mono" id="tool-reply" aria-live="polite">No call made yet.</pre>
    </section>
  </main>
  <aside class="ledger" id="ledger">
    <h2 class="section-title">Ledger</h2>
    <p class="ledger-note" id="ledger-note" hidden></p>
    <ol class="ledger-list" id="ledger-list"></ol>
  </aside>
</div>
<script src="/static/console.js"></script>
</body>
</html>
