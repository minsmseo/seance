[project]
name = "seance"
version = "0.1.0"
description = "A skeleton for building read-only MCP servers on top of legacy device protocols."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.0",
    "fastapi>=0.110",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skeleton/seance"]

[tool.pytest.ini_options]
testpaths = ["skeleton/tests"]
pythonpath = ["skeleton"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["skeleton"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
