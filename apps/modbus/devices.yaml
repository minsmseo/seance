# Seance Modbus app: device description for the simulated batch mixing line.
# Addresses read <unit>:<table>:<offset> and match MEMORY_MAP in simulator.py.
# Host and port come from SEANCE_MODBUS_HOST and SEANCE_MODBUS_PORT, not from this file.
# A scale is only given where the raw register needs conversion (engineering = raw * scale).
devices:
  - name: mixing_tank
    description: Batch mixing tank with an agitator (Modbus unit 1)
    timeout_seconds: 2.0
    points:
      - name: level
        address: "1:holding:0"
        data_type: uint16
        unit: percent
        scale: 0.1
      - name: agitator_speed
        address: "1:holding:1"
        data_type: uint32
        unit: rpm
      - name: temperature
        address: "1:input:0"
        data_type: int16
        unit: degC
        scale: 0.1
      - name: agitator_running
        address: "1:coil:0"
        data_type: bool
        unit: state
      - name: low_level
        address: "1:discrete:0"
        data_type: bool
        unit: state

  - name: feed_pump
    description: Feed pump for the mixing tank (Modbus unit 2)
    timeout_seconds: 2.0
    points:
      - name: runtime_hours
        address: "2:holding:0"
        data_type: uint32
        unit: h
      - name: flow_rate
        address: "2:input:0"
        data_type: float32
        unit: L/min
      - name: pump_running
        address: "2:coil:0"
        data_type: bool
        unit: state
      - name: overload_trip
        address: "2:discrete:0"
        data_type: bool
        unit: state

  - name: chiller
    description: Chiller that cools the batch (Modbus unit 3)
    timeout_seconds: 2.0
    points:
      - name: setpoint
        address: "3:holding:0"
        data_type: int16
        unit: degC
        scale: 0.1
      - name: supply_temp
        address: "3:input:0"
        data_type: float32
        unit: degC
      - name: compressor_on
        address: "3:coil:0"
        data_type: bool
        unit: state
      - name: fault
        address: "3:discrete:0"
        data_type: bool
        unit: state
